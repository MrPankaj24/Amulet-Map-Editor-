name: Test Build - Arch & Portable

on:
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Version number for the package and release tag (e.g., 0.10.35)'
        required: false
        default: '0.10.35'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-arch-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Cache wxPython Wheel
      id: cache-wxpython
      uses: actions/cache@v4
      with:
        path: ~/.cache/wxpython-wheels
        key: wxpython-cp311-ubuntu-24.04-v4.2.5

    - name: Install Python Build Tools
      run: |
        pip install --upgrade pip
        pip install pyinstaller~=6.18 build attrdict3

    - name: Install System Dependencies & wxPython
      run: |
        sudo apt-get update && sudo apt-get install -y \
          libgtk-3-0 \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          freeglut3-dev \
          dbus-x11 \
          libnotify4 \
          libnotify-dev \
          libsdl2-2.0-0 \
          libsdl2-dev \
          libsm6 \
          libsm-dev \
          libcurl4 \
          libsecret-1-0 \
          libpcre2-32-0 \
          xdg-utils \
          libopengl0 \
          libgl1 \
          libgl1-mesa-dri \
          libegl1 \
          libegl-mesa0 \
          libxtst-dev \
          ruby-full \
          zstd \
          libarchive-tools

        mkdir -p ~/.cache/wxpython-wheels
        WHEEL_FILE=~/.cache/wxpython-wheels/wxpython-4.2.5-cp311-cp311-linux_x86_64.whl
        WHEEL_URL="https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp311-cp311-linux_x86_64.whl"

        if [ ! -f "$WHEEL_FILE" ]; then
          echo "Attempting to download prebuilt wxPython wheel with extended timeout..."
          if ! curl -L --connect-timeout 60 --max-time 600 --retry 5 --retry-delay 10 --retry-all-errors -o "$WHEEL_FILE" "$WHEEL_URL"; then
            echo "extras.wxpython.org is down/unreachable. Building wxPython wheel locally (will be cached for future runs)..."
            rm -f "$WHEEL_FILE"
            pip wheel --wheel-dir ~/.cache/wxpython-wheels wxPython==4.2.5
          fi
        fi

        pip install ~/.cache/wxpython-wheels/wx[pP]ython*.whl

    - name: Compile Amulet Wheel
      run: |
        export BDISTWHEELFREEZELIBS=true
        python -m build
        python -m pip install dist/amulet_map_editor-*.whl --upgrade

    - name: Build Standalone Executable (PyInstaller)
      run: |
        python -m PyInstaller -y --distpath ./installer/dist installer/Amulet.spec

    - name: Package for Arch (.pkg.tar.zst) & Portable (.tar.gz)
      id: package_meta
      run: |
        sudo gem install fpm
        
        RAW_VER="${{ inputs.custom_version || github.event.release.tag_name || '0.10.35' }}"
        VERSION="${RAW_VER#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}-arch" >> "$GITHUB_OUTPUT"
        
        # 1. Create Portable Tarball
        tar -czf "installer/dist/Amulet-${VERSION}-Portable-x86_64.tar.gz" -C installer/dist amulet

        # 2. Stage Arch Package Directory
        mkdir -p installer/dist/pkg/opt
        cp -r installer/dist/amulet installer/dist/pkg/opt/amulet_map_editor
        
        mkdir -p installer/dist/pkg/usr/share/icons/hicolor/512x512/apps
        cp installer/amulet_logo_512.png installer/dist/pkg/usr/share/icons/hicolor/512x512/apps/amulet_map_editor.png
        
        mkdir -p installer/dist/pkg/usr/share/applications
        cat << 'EOF' > installer/dist/pkg/usr/share/applications/amulet_map_editor.desktop
        [Desktop Entry]
        Type=Application
        Name=Amulet Map Editor
        Comment=A Minecraft world editor and converter that supports all versions since Java 1.12 and Bedrock 1.7.
        Path=/opt/amulet_map_editor
        Exec=/opt/amulet_map_editor/amulet
        Icon=amulet_map_editor
        Categories=Game;Utility;
        EOF
        sed -i 's/^[ \t]*//' installer/dist/pkg/usr/share/applications/amulet_map_editor.desktop
        
        # Set File Permissions
        find installer/dist/pkg/opt/amulet_map_editor -type f -exec chmod 644 -- {} +
        find installer/dist/pkg/opt/amulet_map_editor -type d -exec chmod 755 -- {} +
        find installer/dist/pkg/usr/share -type f -exec chmod 644 -- {} +
        chmod +x installer/dist/pkg/opt/amulet_map_editor/amulet
        if [ -f installer/dist/pkg/opt/amulet_map_editor/amulet_debug ]; then
          chmod +x installer/dist/pkg/opt/amulet_map_editor/amulet_debug
        fi
        
        # Build Arch Pacman Package
        fpm \
          --chdir installer/dist/pkg \
          --input-type dir \
          --output-type pacman \
          --name "amulet-map-editor" \
          --version "${VERSION}" \
          --description "A Minecraft world editor and converter" \
          --url https://www.amuletmc.com \
          --architecture x86_64 \
          --package "installer/dist/Amulet-${VERSION}-Arch-x86_64.pkg.tar.zst"
        
        rm -rf installer/dist/amulet
        rm -rf installer/dist/pkg

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Amulet-Test-Arch-Packages
        path: ./installer/dist/*

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || steps.package_meta.outputs.tag }}
        name: "Amulet Map Editor ${{ steps.package_meta.outputs.version }} (Arch Linux & Portable)"
        body: |
          ### Arch Linux & Portable Direct Build
          - **Arch Linux Pacman Package:** `sudo pacman -U Amulet-${{ steps.package_meta.outputs.version }}-Arch-x86_64.pkg.tar.zst`
          - **Portable Tarball:** `tar -xzf Amulet-${{ steps.package_meta.outputs.version }}-Portable-x86_64.tar.gz && ./amulet/amulet`
        files: |
          installer/dist/*.pkg.tar.zst
          installer/dist/*.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
