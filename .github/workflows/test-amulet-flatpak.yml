name: Test Build - Flatpak Bundle

on:
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom version/tag identifier for the Flatpak release'
        required: false
        default: '0.10.35'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-flatpak-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Cache wxPython Wheel
      id: cache-wxpython
      uses: actions/cache@v4
      with:
        path: ~/.cache/wxpython-wheels-cp313
        key: wxpython-cp313-ubuntu-24.04-v4.2.5

    - name: Build Python Wheels
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          freeglut3-dev \
          libnotify-dev \
          libsdl2-dev \
          libsm-dev \
          libxtst-dev

        mkdir -p ~/.cache/wxpython-wheels-cp313
        WHEEL_FILE=~/.cache/wxpython-wheels-cp313/wxpython-4.2.5-cp313-cp313-linux_x86_64.whl
        WHEEL_URL="https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp313-cp313-linux_x86_64.whl"

        if [ ! -f "$WHEEL_FILE" ]; then
          echo "Attempting to download prebuilt wxPython cp313 wheel..."
          if ! curl -L --connect-timeout 60 --max-time 600 --retry 5 --retry-delay 10 --retry-all-errors -o "$WHEEL_FILE" "$WHEEL_URL"; then
            echo "extras.wxpython.org timed out. Compiling wxPython wheel locally..."
            rm -f "$WHEEL_FILE"
            pip wheel --wheel-dir ~/.cache/wxpython-wheels-cp313 wxPython==4.2.5
          fi
        fi

        export BDISTWHEELFREEZELIBS=true
        mkdir -p installer/wheels
        cp ~/.cache/wxpython-wheels-cp313/*.whl installer/wheels/
        pip wheel --wheel-dir installer/wheels --find-links ~/.cache/wxpython-wheels-cp313 .

    - name: Build Flatpak Bundle
      id: flatpak_meta
      run: |
        sudo apt-get install -y flatpak flatpak-builder
        flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

        RAW_TAG="${{ inputs.custom_tag || github.event.release.tag_name || '0.10.35' }}"
        TAG="${RAW_TAG//./_}"
        TAG="${TAG//-/_}"

        echo "raw_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
        echo "release_tag=v${RAW_TAG#v}-flatpak" >> "$GITHUB_OUTPUT"
        echo "app_id=com.amuletmc.amulet_map_editor_${TAG}" >> "$GITHUB_OUTPUT"

        # Create Desktop Entry
        cat << EOF > "installer/com.amuletmc.amulet_map_editor_${TAG}.desktop"
        [Desktop Entry]
        Type=Application
        Name=Amulet (${RAW_TAG})
        Comment=A Minecraft world editor and converter that supports all versions since Java 1.12 and Bedrock 1.7.
        Exec=amulet_map_editor
        Icon=com.amuletmc.amulet_map_editor_${TAG}
        EOF
        sed -i 's/^[ \t]*//' "installer/com.amuletmc.amulet_map_editor_${TAG}.desktop"

        # Update App ID in Manifest
        sed "s/com.amuletmc.amulet_map_editor/com.amuletmc.amulet_map_editor_${TAG}/g" installer/com.amuletmc.amulet_map_editor.yml > "installer/com.amuletmc.amulet_map_editor_${TAG}.yml"

        # Compile and Bundle Flatpak
        flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo --install builddir "installer/com.amuletmc.amulet_map_editor_${TAG}.yml"
        mkdir -p installer/dist
        flatpak build-bundle repo "installer/dist/Amulet-${RAW_TAG}-x86_64.flatpak" "com.amuletmc.amulet_map_editor_${TAG}" --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

    - name: Upload Flatpak Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Amulet-Test-Flatpak-Bundle
        path: ./installer/dist/*.flatpak

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || steps.flatpak_meta.outputs.release_tag }}
        name: "Amulet Map Editor ${{ steps.flatpak_meta.outputs.raw_tag }} (Flatpak)"
        body: |
          ### Flatpak Standalone Bundle
          - **Install:** `flatpak install --user Amulet-${{ steps.flatpak_meta.outputs.raw_tag }}-x86_64.flatpak`
          - **Run:** `flatpak run ${{ steps.flatpak_meta.outputs.app_id }}`
        files: installer/dist/*.flatpak
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
